<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#103d4b;--card:#164e60;--card2:#1b6073;--tx:#eef1ff;--mu:#c1cce5;--ac:#7c5cff;--ac2:#22d3ee;--ok:#22c55e;--ko:#ef4444;--wa:#f59e0b;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#137f9055,transparent),radial-gradient(900px 500px at 110% 10%,#18a99944,transparent),var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 0}
#app{max-width:720px;margin:0 auto;padding:14px 14px 110px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:18px 0 10px}h3{margin:0 0 6px;font-size:16px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid #ffffff12;border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 10px 30px #0006}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.g{flex:1}
.mu{color:var(--mu);font-size:13px}.sm{font-size:13px}
button,.btn{font:inherit;color:var(--tx);background:#ffffff14;border:1px solid #ffffff1f;border-radius:14px;padding:11px 16px;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,var(--ac),#5b8cff);border:0;font-weight:700;box-shadow:0 6px 20px #7c5cff66}
.dng{background:#ef444422;border-color:#ef444466}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:16px;border-radius:var(--r);text-align:left;background:linear-gradient(150deg,#21677a,#174b5c);border:1px solid #ffffff14;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:16px}.tile .e{font-size:28px}
.tile.big{grid-column:span 2;background:linear-gradient(135deg,#6d4dff,#2b7cff);min-height:96px}
.bar{height:10px;background:#ffffff18;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px;transition:width .5s}
.ring{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac2) var(--p),#ffffff18 0);flex:none}
.ring span{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:20px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#ffffff18}
.ok{color:var(--ok)}.ko{color:var(--ko)}.wa{color:var(--wa)}
.pill.validated{background:#22c55e33;color:#7dffa8}.pill.rejected{background:#ef444433;color:#ff9a9a}.pill.pending_validation,.pill.needs_review{background:#f59e0b33;color:#ffd27a}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#103d4bee;backdrop-filter:blur(14px);border-top:1px solid #ffffff14;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 12px}
nav button .e{font-size:22px}nav button.on{color:#fff}nav button.on .e{filter:drop-shadow(0 0 8px var(--ac))}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:15px 16px;border-radius:16px;background:#ffffff0f;border:2px solid #ffffff14;font-size:16px}
.opt.sel{border-color:var(--ac);background:#7c5cff26}.opt.good{border-color:var(--ok);background:#22c55e26;animation:pop .35s}.opt.bad{border-color:var(--ko);background:#ef444426;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-size:19px;font-weight:600;line-height:1.4}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:end center;z-index:20;animation:fade .2s}
.modal>div{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@keyframes fade{from{opacity:0}}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:#103d4b;border:1px solid #ffffff25;border-radius:12px;padding:10px;margin:6px 0}
textarea{min-height:140px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#22c55e;color:#04210f;font-weight:700;padding:10px 18px;border-radius:99px;z-index:50;animation:fade .2s;max-width:90%;text-align:center}
.toast.err{background:#ef4444;color:#fff}
.xp{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:34px;font-weight:900;color:var(--ac2);text-shadow:0 0 20px var(--ac2);pointer-events:none;animation:up 1s forwards;z-index:30}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
.cf{position:fixed;top:-10px;width:10px;height:14px;z-index:40;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.heat{display:flex;flex-wrap:wrap;gap:3px}.heat i{width:16px;height:16px;border-radius:4px;background:#ffffff15}
.quote{border-left:3px solid var(--ac2);padding:6px 12px;margin:8px 0;color:#cfd6ff;background:#ffffff08;border-radius:0 10px 10px 0;font-size:14px}
.ov{position:fixed;inset:0;background:#103d4bee;display:grid;place-items:center;z-index:40;text-align:center;padding:30px}
.flame{font-size:26px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#ffffff12;padding:6px 10px;border-radius:12px;margin:3px;font-size:13px}.badge.off{opacity:.35;filter:grayscale(1)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffe086;outline-offset:2px}
body.large .q,body.large .opt{font-size:1.5rem}body.contrast{--bg:#080d12;--card:#111820;--tx:#fff;--mu:#fff}body.light{--bg:#e4eff0;--card:#fff;--tx:#172a33;--mu:#344b56}body.light .tile,body.light nav,body.light .ring,body.light input,body.light select,body.light textarea{color:white}body.light .quote{color:#243650}body.focus .flame,body.focus .xp,body.focus .cf,body.focus .wa{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.download{display:inline-block;padding:.65rem 1rem;border-radius:.75rem;color:white;text-decoration:none} .card,.q,.quote{overflow-wrap:anywhere} @media(max-width:420px){nav button{flex:1;min-width:0;padding:6px 2px}.row.wrap{gap:6px}.modal>div{overflow-x:hidden}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<input type="file" id="file" accept=".pdf,.txt,.md,.json,application/pdf,text/plain,application/json" multiple hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script src="core.js"></script>
<script>
/* ============ Almacenamiento (IndexedDB, todo local) ============ */
let db;
const STORES=['docs','versions','questions','kv','audit','sessions','files'];
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('testmaster',1);r.onupgradeneeded=()=>STORES.forEach(s=>{const store=r.result.createObjectStore(s,{keyPath:'id'});for(const key of ({questions:['vid','docId','state'],versions:['docId','hash'],sessions:['status','ts']}[s]||[]))store.createIndex(key,key)});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const P=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const dbAll=s=>P(st(s).getAll()),dbGet=(s,id)=>P(st(s).get(id)),dbPut=(s,o)=>atomicWrite([s],tx=>tx.objectStore(s).put(o));
async function sha256(buf){
  if(globalThis.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  throw Error('SHA-256 requiere HTTPS o localhost');
}
async function audit(type,msg,extra){await dbPut('audit',{id:Date.now()+'-'+Math.random().toString(36).slice(2,6),ts:Date.now(),type,msg:String(msg).slice(0,300),...(extra||{})})}

/* ============ Estado ============ */
const S={tab:'home',docs:[],vers:[],qs:[],prof:null,run:null,modal:null,busy:null,sessions:[]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DEF={id:'profile',xp:0,streak:0,best:0,lastDay:'',todayDay:'',todayN:0,exams:0,correct:0,answered:0,perfect:0,vibrate:false,sound:false,ocr:true,goal:20};
async function load(){
  const allDocs=await dbAll('docs');S.docs=allDocs.filter(d=>!d.deleted);S.trash=allDocs.filter(d=>d.deleted);S.vers=await dbAll('versions');S.qs=await dbAll('questions');S.qIndex=new Map(S.qs.map(q=>[q.id,q]));S.sessions=(await dbAll('sessions')).sort((a,b)=>b.ts-a.ts);
  S.prof=Object.assign({},DEF,await dbGet('kv','profile')||{});
}
const saveProf=()=>dbPut('kv',S.prof);
const curVer=d=>S.vers.find(v=>v.id===d.cur);
const curQs=(f)=>S.qs.filter(q=>S.docs.some(d=>d.cur===q.vid)&&(!f||f(q)));
const valid=()=>curQs(q=>q.state==='validated'&&Number.isInteger(q.ans)&&q.ans>=0&&q.ans<4&&(q.kind==='provided'?q.answerLetter==='ABCD'[q.ans]:q.reviewedBy==='humano'||q.checks?.length));

/* ============ UI helpers ============ */
let AC;function beep(f,d=.12,t='sine'){if(!S.prof.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const buzz=ms=>{try{S.prof.vibrate&&navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2600)}
function floatXP(n){const e=document.createElement('div');e.className='xp';e.textContent='+'+n+' XP';document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function confetti(){for(let i=0;i<46;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=['#7c5cff','#22d3ee','#22c55e','#f59e0b','#ef4444'][i%5];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
const modal=h=>{S.modal=h;render();focusDialog()};const closeModal=()=>{S.modal=null;render()};
const bump=()=>{const t=today();if(S.prof.todayDay!==t){S.prof.todayDay=t;S.prof.todayN=0}};
function touchStreak(){
  const t=today();if(S.prof.lastDay===t)return;
  const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  const gap=Math.round((Date.parse(t)-Date.parse(S.prof.lastDay))/864e5);S.prof.streak=gap>=0&&gap<=3?S.prof.streak+1:1;S.prof.best=Math.max(S.prof.best,S.prof.streak);S.prof.lastDay=t;
}
function gainXP(n){if(!n)return;const l0=levelOf(S.prof.xp);S.prof.xp+=n;floatXP(n);if(levelOf(S.prof.xp)>l0){toast('🎉 ¡Nivel '+levelOf(S.prof.xp)+'!');beep(880,.3,'triangle');confetti()}}
const ACH=[
 ['🚀','Primer examen',p=>p.exams>=1],['🔥','Racha de 3 días',p=>p.best>=3],['🔥','Racha de 7 días',p=>p.best>=7],['🏆','Examen perfecto',p=>p.perfect>=1],
 ['💯','100 aciertos',p=>p.correct>=100],['🧠','500 aciertos',p=>p.correct>=500],['⭐','Nivel 5',p=>levelOf(p.xp)>=5],['👑','Nivel 10',p=>levelOf(p.xp)>=10]];

/* ============ Procesamiento documental ============ */
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s)});
function pdfOptions(data){
  const url=name=>new URL('vendor/'+name+'/',document.baseURI).href;
  return {data,isEvalSupported:false,useSystemFonts:true,standardFontDataUrl:url('pdf-fonts'),cMapUrl:url('pdf-cmaps'),cMapPacked:true,wasmUrl:url('pdf-wasm')};
}
async function pdfLib(){
  const lib=await import('./vendor/pdf.min.mjs');
  lib.GlobalWorkerOptions.workerSrc=new URL('vendor/pdf.worker.min.mjs',document.baseURI).href;
  return lib;
}
async function ocrCanvas(canvas){
  if(!window.Tesseract)await loadScript('./vendor/tesseract.min.js');
  const local=name=>new URL('vendor/'+name,document.baseURI).href;
  const worker=await Tesseract.createWorker(S.prof.ocrLang||'spa+eng',1,{workerPath:local('worker.min.js'),corePath:local('tesseract-core-lstm.js'),langPath:local(''),workerBlobURL:false});
  let timer;const job=activeImport;
  try{
    const abort=new Promise((_,reject)=>{const stop=()=>reject(Error('OCR cancelado'));if(job)job.stop=stop;timer=setTimeout(()=>reject(Error('OCR superó 90 segundos por página')),90000)});
    checkImport();const {data}=await Promise.race([worker.recognize(canvas),abort]);return {text:data.text,conf:Math.round(data.confidence)}
  }finally{clearTimeout(timer);if(job)job.stop=null;await worker.terminate()}
}
const progress=(msg,pct)=>{S.busy=msg?{msg,pct}:null;render()};
async function ocrPage(pdf,n){
  const pg=await pdf.getPage(n),unit=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2.5,Math.sqrt(8000000/(unit.width*unit.height)))}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;return ocrCanvas(cv);
}
async function extractPdf(buf,onp,only){
  const lib=await pdfLib(),task=lib.getDocument(pdfOptions(buf.slice(0))),pages=[];const job=typeof activeImport==='undefined'?null:activeImport;if(job)job.stop=()=>task.destroy();let pdf;try{pdf=await task.promise}finally{if(job)job.stop=null}
  try{if(pdf.numPages>500)throw Error("Máximo 500 páginas por PDF");for(let n=1;n<=pdf.numPages;n++){checkImport();
    if(only&&only!==n){pages.push(null);continue}
    onp&&onp('Extrayendo texto · pág. '+n+'/'+pdf.numPages,n/pdf.numPages);
    const pg=await pdf.getPage(n),tc=await pg.getTextContent();let t='',ly=null;
    for(const it of tc.items){if(!it.transform)continue;if(ly!==null&&Math.abs(it.transform[5]-ly)>2)t+='\n';else if(t&&!t.endsWith(' ')&&!t.endsWith('\n'))t+=' ';t+=it.str;ly=it.transform[5]}
    t=cleanText(t);let src='native',conf=null,flag=false;
    if(!t||textQuality(t)<0.32&&!/[1-9]\d*\s*=\s*[A-D]/i.test(t)){
      if(S.prof.ocr){try{onp&&onp('OCR · pág. '+n+'/'+pdf.numPages,n/pdf.numPages);const o=await ocrPage(pdf,n);t=cleanText(o.text);src='ocr';conf=o.conf;if(conf<70||t.length<60||textQuality(t)<0.52)flag='OCR de baja confianza ('+conf+'%)'}catch(e){flag='OCR no disponible: '+e.message}}
      else flag='Sin texto nativo (OCR desactivado)';
    }
    pages.push({n,text:t,src,conf,flag});
  }
  return{pages};}finally{await pdf.destroy()}
}
async function atomicWrite(stores,fn){return new Promise((resolve,reject)=>{const tx=db.transaction(stores,'readwrite');tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||new Error('Operación cancelada'));try{fn(tx)}catch(e){tx.abort();reject(e)}})}
async function registerVersion(name,hash,pages,size,blob,parsed,sourceJSON=null){
  const doc={id:uid(),name,created:Date.now(),vcount:1,cur:null};
  const vid=uid(),{chunks,sections}=buildChunks(vid,pages),ver={id:vid,docId:doc.id,n:1,hash,size,pages,chunks,sections,sourceJSON,processed:Date.now(),status:'indexado'};doc.cur=vid;
  for(const q of parsed){q.optionIds=q.opts.map((_,i)=>q.id+'-'+i);q.revision=1;q.vid=vid;q.docId=doc.id;q.ev.vid=vid}
  await atomicWrite(['docs','versions','questions','files','audit'],tx=>{const ok=parsed.filter(q=>q.state==='validated').length;tx.objectStore('audit').put({id:uid(),type:'job',ts:Date.now(),msg:'Importación de banco',proposed:parsed.length,validated:ok,pending:parsed.length-ok});tx.objectStore('docs').put(doc);tx.objectStore('versions').put(ver);if(blob)tx.objectStore('files').put({id:vid,blob});for(const q of parsed)tx.objectStore('questions').put(q)});
  await load();return {total:parsed.length,ok:parsed.filter(q=>q.state==='validated').length,pending:parsed.filter(q=>q.state!=='validated').length};
}
async function reprocessVersion(id){
  const v=S.vers.find(x=>x.id===id);if(!v)return;const fresh=v.sourceJSON?parseExamJSON(v.sourceJSON):parseProvidedExam(v.pages);diagnose(fresh,S.qs.filter(q=>q.vid!==id),v.pages);const old=S.qs.filter(q=>q.vid===id&&q.kind==='provided');let fixed=0;const updates=[];const byNumber=new Map();for(const x of fresh){if(x.state!=='validated')continue;if(!byNumber.has(x.sourceNumber))byNumber.set(x.sourceNumber,[]);byNumber.get(x.sourceNumber).push(x)}
  for(const q of old){if(q.state!=='needs_review'&&q.state!=='pending_validation')continue;const matches=byNumber.get(q.sourceNumber)||[];if(matches.length!==1)continue;const x=matches[0];if(optionNorm(x.q)!==optionNorm(q.q)||JSON.stringify(x.opts.map(optionNorm))!==JSON.stringify(q.opts.map(optionNorm)))continue;updates.push({...q,ans:x.ans,answerLetter:x.answerLetter,state:'validated',reasons:[],score:100,expl:x.expl});fixed++}
  if(updates.length)await exportBackup();await atomicWrite(['questions'],tx=>{for(const q of updates)tx.objectStore('questions').put(q)});await load();render();toast(fixed+' preguntas recuperadas; las restantes requieren revisión');
}
async function generateFor(ver,max){
  const t0=Date.now();progress('Generando y verificando preguntas…',.9);
  const existing=S.qs.filter(q=>q.vid===ver.id);
  const cands=genQuestions(ver,max||80),acc=[...existing],reasons={};let v=0,r=0,p=0;
  for(const q of cands){
    const res=verifyQ(q,ver,acc);
    if(res.reasons.length===1&&res.reasons[0]==='Pregunta duplicada'&&existing.length)continue;
    q.state=res.state;q.score=res.score;q.checks=res.checks;q.reasons=res.reasons;q.validatedAt=Date.now();
    if(q.state==='validated')v++;else if(q.state==='rejected'){r++;res.reasons.forEach(x=>reasons[x]=(reasons[x]||0)+1)}else p++;
    acc.push(q);await dbPut('questions',q);
  }
  const ms=Date.now()-t0;await audit('job',`Generación v${ver.n}: ${v+r+p} propuestas, ${v} validadas, ${r} rechazadas`,{proposed:v+r+p,validated:v,rejected:r,pending:p,reasons,ms,tokens:0,cost:0});
  await load();return{proposed:v+r+p,v,r,p};
}
/* importación en import.js */
/* ============ Exámenes ============ */
const pub=q=>({id:q.id,q:q.q,opts:q.opts});
async function startRun({mode,docIds,n,learn,secs}){
  let pool=valid();if(docIds&&docIds.length)pool=pool.filter(q=>docIds.includes(q.docId));
  const now=Date.now();
  if(mode==='review')pool=pool.filter(q=>q.st.seen>0&&q.srs.due<=now);
  if(mode==='failed')pool=pool.filter(q=>q.st.ko>0&&q.st.ok<=q.st.ko);
  if(mode==='fav')pool=pool.filter(q=>q.fav);
  pool=filterPool(pool,mode);
  const want=n||40;
  if(pool.length<want&&(mode==='sim'||mode==='custom')){
    modal(`<h2>No hay suficientes preguntas disponibles</h2><p>Existen <b>${pool.length}</b> preguntas aptas para estudiar en este alcance y el examen pedía <b>${want}</b>. No se inventan las que faltan.</p><p class="mu">Falta contenido: añade más documentos o texto, o reduce el tamaño.</p>
    <div class="row wrap">${pool.length?`<button class="pri" data-a="runN" data-mode="${mode}" data-n="${pool.length}" data-learn="${learn?1:0}" data-docs="${(docIds||[]).join(',')}">Hacer examen de ${pool.length}</button>`:''}<button data-a="tab" data-t="lib">Añadir material</button><button data-a="close">Cerrar</button></div>`);return;
  }
  if(!pool.length){toast(mode==='review'?'🎉 Nada pendiente de repaso hoy':'No hay preguntas para este modo',true);return}
  const ordered=(mode==='sim'||mode==='custom')&&pool.length&&pool.every(q=>q.kind==='provided')?pool.slice().sort((a,b)=>(a.sourceOrder||a.sourceNumber||0)-(b.sourceOrder||b.sourceNumber||0)).slice(0,Math.min(want,pool.length)):pickExam(pool,Math.min(want,pool.length),mode==='daily'?rng(Number(today().replaceAll('-',''))):Math.random);

  const ids=ordered.map(q=>q.id);
  S.run={id:uid(),mode,learn:learn!==false,orders:Object.fromEntries(ordered.map(q=>[q.id,S.prof.shuffle?shuffle([0,1,2,3],Math.random):[0,1,2,3]])),snap:Object.fromEntries(ordered.map(q=>[q.id,studyCopy(q)])),ids,i:0,ans:{},t0:Date.now(),secs:secs||0,combo:0,xp:0,done:false,res:null,locked:false,sel:null,left:secs||0};

async function applyResult(q,ok){

function forgetReceipt(){try{globalThis.localStorage?.removeItem('testclau.pendingAnswer')}catch{}}
function clearReceipt(receipt){
  try{const store=globalThis.localStorage;if(store?.getItem('testclau.pendingAnswer')===receipt)store.removeItem('testclau.pendingAnswer')}catch{}
}
async function recoverAnswer(){
  let raw;try{raw=globalThis.localStorage?.getItem('testclau.pendingAnswer')}catch{}
  if(!raw)return;
  let r;try{r=JSON.parse(raw)}catch{clearReceipt(raw);return}
  const run=S.run;
  if(run.id!==r.id)return;
  if(run.i===r.step&&run.ids[run.i]===r.question&&!run.locked&&Number.isInteger(r.choice)&&r.choice>=-1&&r.choice<4&&(run.learn||run.sel!==r.choice))await choose(r.choice);
  clearReceipt(raw);
}
async function choose(i){
  const R=S.run;if(!R||R.locked||R.done)return;const q=runQuestion(R,R.i);
  const receipt=JSON.stringify({id:R.id,step:R.i,question:q.id,choice:i});
  try{globalThis.localStorage?.setItem('testclau.pendingAnswer',receipt)}catch{}
  if(!R.learn){R.sel=i;R.ans[R.i]=i;await saveRun();clearReceipt(receipt);render();return}
  R.locked=true;R.sel=i;R.ans[R.i]=i;const ok=correctOption(q,i);
  if(R.mode!=='cards')await applyResult(qOf(q.id),ok);
  if(ok){R.combo++;const x=R.mode==='cards'?0:10+Math.min(R.combo,10)*2;R.xp+=x;if(x)gainXP(x);beep(660,.12,'triangle');beep(990,.15,'triangle');buzz(20)}else{R.combo=0;beep(180,.25,'sawtooth');buzz([60,40,60])}
  if(!ok&&R.mode==='survival')R.ids.length=R.i+1;
  if(!ok&&['learn','quick','failed','review'].includes(R.mode)&&!(R.retried||[]).includes(q.id)){(R.retried||=[]).push(q.id);R.ids.push(q.id)}
  await commitRun([qOf(q.id)]);clearReceipt(receipt);render();
}
async function nextQ(){
  const R=S.run;if(!R||R.done||(!R.locked&&(R.learn||R.sel==null)))return;if(R.i+1>=R.ids.length)return finishRun();
  R.i++;R.doubt=false;R.flipped=false;R.locked=false;R.sel=R.ans[R.i]!=null?R.ans[R.i]:null;R.left=R.secs;await saveRun();render();startTimer();
}
async function finishRun(){
  const R=S.run;if(R.done)return;clearInterval(TM);let ok=0,det=[];
  for(let k=0;k<R.ids.length;k++){
    const q=runQuestion(R,k),a=R.ans[k]!=null?R.ans[k]:-1,good=correctOption(q,a);if(good)ok++;
    if(!R.learn)await applyResult(qOf(q.id),good);
    det.push({id:q.id,a,optionId:a>=0?(q.optionIds?.[a]||q.id+'-'+a):null,good,snapshot:studyCopy(q)});
  }
  const pct=Math.round(ok/R.ids.length*100);let bonus=R.mode==='cards'?0:Math.round(pct/2)+(pct===100?50:0);
  if(!R.learn)R.xp+=ok*10;R.xp+=bonus;
  if(R.mode!=='cards')S.prof.exams++;if(R.mode!=='cards'&&pct===100&&R.ids.length>=10)S.prof.perfect++;touchStreak();
  R.done=true;R.res={ok,total:R.ids.length,pct,det,bonus};
  gainXP(bonus+(R.learn?0:ok*10));
  await commitRun(R.learn?[]:R.ids.map(qOf),{id:R.id,status:'final',final:true,mode:R.mode,res:R.res,ts:Date.now(),secs:Math.round((Date.now()-R.t0)/1000)});
  await load();if(pct>=70){confetti();beep(784,.2,'triangle')}render();
}

  pick:d=>choose(+d.i),next:nextQ,fav:d=>toggleFav(d.id),
  exit:()=>modal(`<h2>¿Salir?</h2><p class="mu">Tu progreso se guarda y podrás reanudar.</p><div class="row"><button class="g" data-a="close">Seguir</button><button class="pri g" data-a="home2">Salir</button></div>`),
  home2:async()=>{clearInterval(TM);if(S.run&&!S.run.done)await saveRun();S.modal=null;await load();S.tab='home';S.run=null;render()},
  resume:async d=>{const s=S.sessions.find(x=>x.status==='open'&&(!d?.id||d.id===x.id));if(!s)return;S.run=structuredClone(s.run);if(!S.run.snap)S.run.snap=Object.fromEntries(S.run.ids.map(id=>[id,studyCopy(qOf(id))]));S.run.sel=S.run.ans[S.run.i]!=null?S.run.ans[S.run.i]:null;S.tab='run';await recoverAnswer();render();startTimer()},
  editQ:d=>{const q=qOf(d.id);modal(`<h2>Editar pregunta</h2><p>${esc(provenance(q))} · Pág. ${q.ev.page}</p><p>${esc(q.ev.quote)}</p><textarea id="eq">${esc(q.q)}</textarea>${Array.from({length:4},(_,i)=>q.opts[i]||'').map((o,i)=>`<label>${'ABCD'[i]}</label><textarea id="eo${i}">${esc(o)}</textarea>`).join('')}<select id="ea"><option value="">Elegir respuesta correcta</option>${[0,1,2,3].map(i=>`<option value="${i}" ${q.answerLetter&&i===q.ans?'selected':''}>${'ABCD'[i]}</option>`).join('')}</select><label><input type="checkbox" id="academic" style="width:auto"> He contrastado esta respuesta con el temario indicado en la referencia</label><label>Referencia al temario<input id="ref" value="${esc(q.referencia||'')}"></label><button data-a="saveQ" data-id="${q.id}">Guardar y validar</button>`)},
  saveQ:async d=>{const q={...qOf(d.id)},text=$('#eq').value.trim(),opts=[0,1,2,3].map(i=>$('#eo'+i).value.trim()),a=$('#ea').value;if(q.kind!=='provided'){const test=verifyQ({...q,q:text,opts,ans:+a},S.vers.find(v=>v.id===q.vid),S.qs.filter(o=>o.vid===q.vid));if(test.checks.some(c=>c.crit&&!c.ok&&c.name!=='respuesta_respaldada_humana')||!$('#academic').checked)throw Error('Contrasta la fuente y resuelve las comprobaciones pendientes')}if(!text||!opts.every(Boolean)||new Set(opts.map(optionNorm)).size!==4||a===''){toast('Completa las opciones y elige una respuesta',true);return}if($('#academic').checked&&!$('#ref').value.trim())throw Error('Indica la referencia que has consultado');q.history=[...(q.history||[]),studyCopy(q)];q.optionIds=opts.map((value,i)=>value===q.opts[i]?(q.optionIds?.[i]||q.id+'-'+i):uid());q.revision=(q.revision||1)+1;Object.assign(q,{q:text,opts,ans:+a,answerLetter:'ABCD'[+a],state:'validated',reasons:[],referencia:$('#ref').value.trim(),keySource:'edición manual',academic:$('#academic').checked,reviewedBy:'humano',validatedAt:Date.now()});await dbPut('questions',q);S.modal=null;render()},
  approve:d=>A.editQ(d),
  reject:async d=>{const q=qOf(d.id);q.state='rejected';q.reasons=['Rechazada manualmente'];await dbPut('questions',q);await audit('review','Rechazada manualmente '+q.id);render()},
  tog:async d=>{S.prof[d.k]=!S.prof[d.k];await saveProf();render()},
  delDoc:d=>modal(`<h2>¿Mover a la papelera?</h2><p>Podrás recuperar el banco desde Más.</p><button data-a="delGo" data-id="${esc(d.id)}">Mover</button><button data-a="close">Cancelar</button>`),
  delGo:d=>trashDoc(d.id,true),
  toc:d=>{const v=S.vers.find(x=>x.id===d.v);const secs=v.sections.length?v.sections:[];modal(`<h2>📑 Índice</h2><p class="mu sm">${secs.length} apartados detectados · ${v.pages.length} páginas</p>${secs.map(s=>`<div class="row sp sm"><span>${esc(s.title)}</span><span class="mu">pág. ${s.page}</span></div>`).join('')||'<p class="mu">No se detectaron títulos; el documento se organiza por páginas.</p>'}<h3 style="margin-top:12px">Preguntas por página</h3><div class="heat">${v.pages.map(p=>{const n=S.qs.filter(q=>q.vid===v.id&&q.ev.page===p.n&&q.state==='validated').length;return`<i title="Pág ${p.n}: ${n}" style="${n?`background:rgba(124,92,255,${Math.min(1,.25+n*.2)})`:''}"></i>`}).join('')}</div><button style="margin-top:14px" data-a="close">Cerrar</button>`)},
  ocr:async d=>{
    try{const f=await dbGet('files',d.v);if(!f)throw new Error('PDF original no disponible');const v=S.vers.find(x=>x.id===d.v);progress('Reprocesando página '+d.n+'…',.5);
      const buf=await f.blob.arrayBuffer(),lib=await pdfLib(),pdf=await lib.getDocument(pdfOptions(buf)).promise,o=await ocrPage(pdf,+d.n),pg=v.pages.find(p=>p.n===+d.n);
      pg.text=cleanText(o.text);pg.src='ocr';pg.conf=o.conf;pg.flag=(o.conf<70||pg.text.length<60||textQuality(pg.text)<0.52)?'OCR de baja confianza ('+o.conf+'%)':false;
      const{chunks,sections}=buildChunks(v.id,v.pages);v.chunks=chunks;v.sections=sections;await dbPut('versions',v);await load();
      await pdf.destroy();progress(null);await reprocessVersion(v.id);
    }catch(e){progress(null);toast(e.message,true)}
  },
  extra:d=>{
    const doc=S.docs.find(x=>x.id===d.id),v=curVer(doc);let txt='';for(const p of v.pages){if(p.flag)continue;if((txt+p.text).length>12000)break;txt+=`\n[PÁGINA ${p.n}]\n${p.text}`}
    const prompt=`Eres un redactor de tests. Con el TEXTO de abajo crea preguntas tipo test de 4 alternativas (una sola correcta). Usa SOLO información del texto. Cada pregunta debe incluir la cita literal (copiada tal cual) y su página. Responde SOLO con un JSON válido: [{"q":"enunciado","opts":["A","B","C","D"],"ans":0,"expl":"explicación","page":1,"quote":"cita literal del texto","diff":"facil|media|dificil"}]\n\nTEXTO:${txt}`;
    window._prompt=prompt;
    modal(`<h2>🧩 Preguntas desde otro chat</h2><p class="mu sm">1) Copia el prompt y pégalo en cualquier chat de IA gratuito. 2) Pega aquí el JSON que te devuelva. La app comprueba que cada cita exista en la página indicada; la respuesta correcta la apruebas tú en Revisar.</p><button class="g" style="width:100%" data-a="copyP">📋 Copiar prompt</button><textarea id="jt" placeholder='Pega aquí el JSON…'></textarea><div class="row"><button class="pri g" data-a="impJson" data-id="${d.id}">Importar y comprobar</button><button class="g" data-a="close">Cancelar</button></div>`);
  },
  copyP:async()=>{try{await navigator.clipboard.writeText(window._prompt);toast('Prompt copiado')}catch(e){toast('No se pudo copiar',true)}},
  impJson:async d=>{
    try{const doc=S.docs.find(x=>x.id===d.id),v=curVer(doc);let t=$('#jt').value.trim();const m=t.match(/\[[\s\S]*\]/);if(!m)throw new Error('No se encontró un array JSON');const arr=JSON.parse(m[0]);
      if(arr.length>10000)throw Error('Máximo 10.000 preguntas');let acc=[...S.qs.filter(q=>q.vid===v.id)],n=0,bad=0;const imported=[];
      for(const x of arr){
        let a=x.ans;if(typeof a==='string'){const L='ABCD'.indexOf(a.trim().toUpperCase()[0]);a=L>=0?L:parseInt(a,10)}
        const opts=Array.isArray(x.opts)?x.opts.map(o=>typeof o==='string'?o.replace(/^\s*[A-Da-d][).:]\s+/,'').trim():o):x.opts;
        const q={id:uid(),vid:v.id,docId:v.docId,kind:'ext',q:x.q,opts,ans:a,expl:x.expl||'',ev:{vid:v.id,page:+x.page,chunkId:null,quote:String(x.quote||'')},diff:x.diff||'media',state:'draft',created:Date.now(),srs:{box:0,due:0},st:{seen:0,ok:0,ko:0,last:0},fav:false};
        if(typeof q.q!=='string'||!Array.isArray(opts)||opts.length!==4||opts.some(o=>typeof o!=='string')||!Number.isInteger(q.ev.page))throw Error('Pregunta externa incompleta');const r=verifyQ(q,v,acc);q.state=r.state;q.score=r.score;q.checks=r.checks;q.reasons=r.reasons;if(q.state==='pending_validation')n++;else bad++;acc.push(q);imported.push(q)}
      await atomicWrite(['questions'],tx=>imported.forEach(q=>tx.objectStore('questions').put(q)));await audit('job',`Importación externa: ${n} pendientes de revisión, ${bad} rechazadas`,{proposed:arr.length,validated:0,rejected:bad,pending:n,tokens:0,cost:0,reasons:{}});await load();S.modal=null;render();toast(`${n} en Revisar, ${bad} rechazadas (cita no encontrada o esquema)`)
    }catch(e){toast('JSON no válido: '+e.message,true)}
  },
  goal:async(d,e)=>{S.prof.goal=+e.target.value;await saveProf();render()},
  export:()=>exportBackup(true),
  import:()=>$('#imp').click(),
  audit:()=>{
    const jobs=S.sessions&&[];dbAll('audit').then(rows=>{
      const J=rows.filter(r=>r.type==='job'),E=rows.filter(r=>r.type==='error'),sum=k=>J.reduce((s,j)=>s+(j[k]||0),0),R={};J.forEach(j=>Object.entries(j.reasons||{}).forEach(([k,v])=>R[k]=(R[k]||0)+v));
      const prop=sum('proposed'),val=S.qs.filter(q=>q.state==='validated').length,rej=S.qs.filter(q=>q.state==='rejected').length;
      modal(`<h2>🧾 Auditoría</h2><div class="grid"><div class="card"><div class="mu sm">Documentos</div><h2>${S.docs.length}</h2></div><div class="card"><div class="mu sm">Propuestas</div><h2>${prop}</h2></div><div class="card"><div class="mu sm">Validadas</div><h2 class="ok">${val}</h2></div><div class="card"><div class="mu sm">Rechazadas</div><h2 class="ko">${rej}</h2></div></div>
      <p>Aceptación: <b>${prop?Math.round(sum('validated')/prop*100):0}%</b> · Tiempo: ${(sum('ms')/1000).toFixed(1)} s · Tokens: 0 · Coste: 0 €</p>
      <h3>Motivos de rechazo</h3>${Object.entries(R).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row sp sm"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<p class="mu sm">Ninguno.</p>'}
      <h3 style="margin-top:12px">Errores técnicos (${E.length})</h3>${E.slice(-5).map(e=>`<div class="sm ko">${esc(e.msg)}</div>`).join('')||'<p class="mu sm">Ninguno.</p>'}<button style="margin-top:12px" data-a="close">Cerrar</button>`)});
  },
  wipe:()=>modal(`<h2>¿Borrar TODO?</h2><p class="mu">Esto no se puede deshacer. Exporta una copia antes.</p><div class="row"><button class="g" data-a="close">Cancelar</button><button class="dng g" data-a="wipeGo">Borrar todo</button></div>`),
  wipeGo:async()=>{await atomicWrite(STORES,tx=>STORES.forEach(s=>tx.objectStore(s).clear()));forgetReceipt();await load();S.modal=null;S.tab='home';render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(location.hash==='#seguro'&&!['safeExport','safeDiag'].includes(el.dataset.a))return;const f=A[el.dataset.a];if(f){if(el.tagName==='SELECT')return;dispatchAction(f,el.dataset,e)}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a==='goal')A.goal({},e)});
$('#file').addEventListener('change',async e=>{for(const f of e.target.files)await ingest(f);e.target.value='';render()});
</script>
